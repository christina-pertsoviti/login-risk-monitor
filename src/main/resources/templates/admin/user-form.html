<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User | Login Risk Monitor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="page-container">

    <section class="card user-form-card">
        <h1 class="logo-title">Create User</h1>
        <p class="subtitle">
            Add a new account and assign its authorization role.
        </p>

        <form th:action="@{/admin/users}"
              th:object="${userForm}"
              method="post">

            <div class="form-group">
                <label for="username">Username</label>
                <input id="username"
                       type="text"
                       th:field="*{username}"
                       autocomplete="off"
                       placeholder="Enter a username">
                <p class="field-error"
                   th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}">
                </p>
            </div>

            <div class="form-group">
                <label for="password">Temporary password</label>
                <input id="password"
                       type="password"
                       th:field="*{password}"
                       autocomplete="new-password"
                       placeholder="At least 8 characters">
                <p class="field-error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>
            </div>

            <div class="form-group">
                <label for="roleName">Role</label>
                <select id="roleName" th:field="*{roleName}">
                    <option value="">Select a role</option>
                    <option th:each="role : ${roles}"
                            th:value="${role.name}"
                            th:text="${role.name}">
                    </option>
                </select>
                <p class="field-error"
                   th:if="${#fields.hasErrors('roleName')}"
                   th:errors="*{roleName}">
                </p>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/users}" class="btn btn-secondary">
                    Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    Create User
                </button>
            </div>

        </form>
    </section>

</main>

</body>
</html>
